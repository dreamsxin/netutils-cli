[package]
name = "netutils-cli"
version = "0.5.0"
edition = "2021"
description = "Cross-platform network diagnostics toolkit: interfaces, routing, proxy, ping, DNS, TLS, HTTP, plugins, port scan, connectivity, and full-link diagnosis"
license = "MIT"
repository = "https://github.com/dreamsxin/netutils-cli"
keywords = ["network", "cli", "ping", "dns", "traceroute"]
categories = ["command-line-utilities", "network-programming"]
# 固定工具链只约束本仓库的开发与 CI，不应随 crate 发布出去强迫
# 用户下载特定版本的 rustc。
exclude = ["rust-toolchain.toml", ".github/"]

[[bin]]
name = "netutils"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.2"
unicode-width = "0.2"
tokio = { version = "1", features = ["full"] }
surge-ping = "0.8"
trust-dns-resolver = "0.23"
socket2 = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
once_cell = "1"
anyhow = "1"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "0.26"
rustls-native-certs = "0.8"
x509-parser = "0.18"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.52", features = ["Win32_Globalization"] }
